<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ownwise — Scan your home. Own it wisely.</title>
<meta name="description" content="Scan your home in 60 seconds and get a verified, living asset register for insurance, tax depreciation and your consumer rights.">
<meta name="theme-color" content="#3730A3">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F5FA; --surface:#FFFFFF; --surface-2:#F0F0F7; --ink:#12122A; --ink-2:#4A4A66; --ink-3:#83839C;
  --line:#E6E6F0; --brand:#4F46E5; --brand-2:#7C3AED; --brand-ink:#3730A3; --brand-soft:#EEEDFF; --coral:#FF6B4A; --coral-soft:#FFEDE8;
  --good:#0E9F6E; --good-soft:#E0F6EE; --warn:#B7790B; --warn-soft:#FFF4DA; --danger:#DC3E3E; --danger-soft:#FDECEC;
  --shadow:0 1px 2px rgba(18,18,42,.04),0 8px 28px rgba(18,18,42,.07); --radius:20px;
  --grad:linear-gradient(135deg,#6366F1 0%,#7C3AED 55%,#A855F7 100%);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0B0B17; --surface:#14142A; --surface-2:#1C1C36; --ink:#EDEDF7; --ink-2:#B3B3CC; --ink-3:#7F7F9C;
  --line:#26264A; --brand:#8B85FF; --brand-ink:#C2BEFF; --brand-soft:#232250; --coral-soft:#3A2220;
  --good:#3DD6A3; --good-soft:#123329; --warn:#F2B740; --warn-soft:#3A2F14; --danger:#FF7676; --danger-soft:#3D1D22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B0B17; --surface:#14142A; --surface-2:#1C1C36; --ink:#EDEDF7; --ink-2:#B3B3CC; --ink-3:#7F7F9C;
  --line:#26264A; --brand:#8B85FF; --brand-ink:#C2BEFF; --brand-soft:#232250; --coral-soft:#3A2220;
  --good:#3DD6A3; --good-soft:#123329; --warn:#F2B740; --warn-soft:#3A2F14; --danger:#FF7676; --danger-soft:#3D1D22;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 20px;font-weight:900;font-size:21px;letter-spacing:-.03em}
.brand svg{width:36px;height:36px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:var(--ink-2);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a.active{background:var(--brand-soft);color:var(--brand-ink)}
.nav svg{width:21px;height:21px;flex:none}
.nav .badge{margin-left:auto;background:var(--coral);color:#fff;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px}
.scanbtn{margin:14px 0 6px;display:flex;align-items:center;justify-content:center;gap:10px;padding:14px;border-radius:16px;border:none;background:var(--grad);color:#fff;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 10px 24px rgba(99,102,241,.35)}
.scanbtn svg{width:20px;height:20px}
.side-foot{margin-top:auto;padding:12px;border-radius:14px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
main{padding:30px 38px 120px;max-width:1180px;width:100%}
.top{display:flex;align-items:flex-end;gap:12px;margin-bottom:22px;flex-wrap:wrap}
.top h1{font-size:30px;letter-spacing:-.035em;margin:0;font-weight:900;line-height:1.1}
.top .sub{color:var(--ink-3);font-size:14.5px;margin-top:4px}
.top .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 3px;font-size:16.5px;letter-spacing:-.015em}
.muted{color:var(--ink-3);font-size:13.5px}
.hero{background:var(--grad);color:#fff;border:none;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .muted{color:rgba(255,255,255,.8)}
.big{font-size:40px;font-weight:900;letter-spacing:-.04em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .label{color:var(--ink-3);font-size:13px;font-weight:600}
.kpi .val{font-size:24px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--danger)}
.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:10px 15px;border-radius:13px;font-weight:700;cursor:pointer;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.grad{background:var(--grad);border:none;color:#fff}
.btn.white{background:#fff;color:#3730A3;border:none}
.btn.coral{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px}
.btn.danger{color:var(--danger)}
.btn svg{width:16px;height:16px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip svg{width:12px;height:12px}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.warn{background:var(--warn-soft);color:var(--warn)}.chip.bad{background:var(--danger-soft);color:var(--danger)}.chip.brand{background:var(--brand-soft);color:var(--brand-ink)}.chip.coral{background:var(--coral-soft);color:var(--coral)}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.stack>*+*{margin-top:12px}
label.f{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin-bottom:5px}
.input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);outline:none}
.input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);font-weight:700;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tablewrap{overflow-x:auto}
.empty{text-align:center;padding:36px 20px;color:var(--ink-3)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:none;background:transparent;padding:8px 13px;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.callout{border-radius:14px;padding:13px 15px;background:var(--brand-soft);font-size:13.5px}
.callout.coral{background:var(--coral-soft)}.callout.good{background:var(--good-soft)}.callout.warn{background:var(--warn-soft)}.callout.bad{background:var(--danger-soft)}
/* Score ring */
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-size:38px;font-weight:900;letter-spacing:-.04em;line-height:1}
.ring .n span{font-size:11px;opacity:.8;display:block;margin-top:2px;font-weight:600}
/* Feed */
.moment{display:flex;gap:14px;padding:16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);align-items:flex-start}
.moment+.moment{margin-top:12px}
.moment .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;flex:none;font-size:22px;background:var(--surface-2)}
.moment .ic.bad{background:var(--danger-soft)}.moment .ic.brand{background:var(--brand-soft)}.moment .ic.good{background:var(--good-soft)}.moment .ic.warn{background:var(--warn-soft)}.moment .ic.coral{background:var(--coral-soft)}
.moment .mt{display:block;font-weight:800;font-size:15px;letter-spacing:-.01em}
.moment p{margin:3px 0 10px;color:var(--ink-2);font-size:13.5px}
.moment .tag{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3)}
/* Asset tiles */
.places{display:flex;gap:12px;overflow-x:auto;padding-bottom:4px;margin-bottom:18px}
.place{flex:none;min-width:210px;border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;background:var(--surface);cursor:pointer;text-align:left}
.place.on{border-color:var(--brand);background:var(--brand-soft)}
.place .e{font-size:22px}
.place b{display:block;margin-top:4px;font-size:14.5px}
.place small{color:var(--ink-3);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.tile{border-radius:20px;overflow:hidden;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);cursor:pointer;transition:transform .15s,box-shadow .15s;display:flex;flex-direction:column}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(18,18,42,.12)}
.tile .pic{height:118px;display:grid;place-items:center;font-size:46px;position:relative}
.tile .pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tile .pic .badges{position:absolute;left:8px;top:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap}
.tile .pic .st{position:absolute;right:8px;bottom:8px;font-size:11px}
.tile .pic .chip{box-shadow:0 2px 8px rgba(0,0,0,.12)}
.tile .body{padding:12px 14px 14px}
.tile .nm{font-weight:800;font-size:14px;line-height:1.3;letter-spacing:-.01em}
.tile .meta{font-size:12px;color:var(--ink-3);margin-top:2px}
.tile .v{display:flex;justify-content:space-between;margin-top:8px;font-size:12.5px;color:var(--ink-3)}
.tile .v b{color:var(--ink)}
.roomhead{display:flex;align-items:center;gap:10px;margin:22px 0 10px;font-weight:800;font-size:15px}
.roomhead span{color:var(--ink-3);font-weight:600;font-size:13px}
.clock{height:7px;border-radius:99px;background:var(--surface-2);position:relative;overflow:hidden}
.clock i{position:absolute;top:0;bottom:0;border-radius:99px}
/* Modal / sheet */
.modal-bg{position:fixed;inset:0;background:rgba(8,8,22,.55);display:grid;place-items:center;padding:16px;z-index:50;backdrop-filter:blur(4px);animation:fade .15s}
.modal{background:var(--surface);border-radius:26px;max-width:700px;width:100%;max-height:94vh;overflow:auto;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s}
.modal h2{margin:0 0 4px;font-size:23px;letter-spacing:-.03em}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.hero-pic{height:190px;border-radius:20px;display:grid;place-items:center;font-size:84px;position:relative;overflow:hidden;margin:-6px -6px 16px}
.hero-pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opt{display:block;border:1.5px solid var(--line);border-radius:14px;padding:11px 14px;cursor:pointer;margin-bottom:8px}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{margin-right:8px}
.letter{white-space:pre-wrap;font-family:ui-serif,Georgia,serif;font-size:14px;line-height:1.6;background:var(--surface-2);border-radius:14px;padding:18px;border:1px solid var(--line)}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;z-index:80;box-shadow:var(--shadow);font-size:14px;max-width:90vw;text-align:center}
/* Scanner */
.scanner{position:relative;border-radius:22px;overflow:hidden;background:#0b0b17;aspect-ratio:16/10}
.scanner video,.scanner img.shot,.scanner svg.room{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .beam{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#A5B4FC,transparent);box-shadow:0 0 18px 6px rgba(129,140,248,.55);animation:beam 2.2s ease-in-out infinite}
@keyframes beam{0%{top:4%}50%{top:94%}100%{top:4%}}
.scanner .corners{position:absolute;inset:14px;border-radius:16px;pointer-events:none;background:
 linear-gradient(#fff,#fff) top left/26px 3px no-repeat,linear-gradient(#fff,#fff) top left/3px 26px no-repeat,
 linear-gradient(#fff,#fff) top right/26px 3px no-repeat,linear-gradient(#fff,#fff) top right/3px 26px no-repeat,
 linear-gradient(#fff,#fff) bottom left/26px 3px no-repeat,linear-gradient(#fff,#fff) bottom left/3px 26px no-repeat,
 linear-gradient(#fff,#fff) bottom right/26px 3px no-repeat,linear-gradient(#fff,#fff) bottom right/3px 26px no-repeat;opacity:.85}
.det{position:absolute;border:2px solid #A5B4FC;border-radius:10px;background:rgba(99,102,241,.12);animation:det .35s ease-out both}
.det.lb span{top:auto;bottom:-26px}.det.lr span{left:auto;right:-2px}
.det span{position:absolute;left:-2px;top:-26px;background:#6366F1;color:#fff;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;white-space:nowrap}
@keyframes det{from{opacity:0;transform:scale(1.15)}}
.scanhud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:700;font-size:13px}
.scanhud .pill{background:rgba(10,10,30,.6);backdrop-filter:blur(6px);padding:7px 12px;border-radius:99px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.mode{border:1.5px solid var(--line);border-radius:20px;padding:18px;text-align:left;background:var(--surface);cursor:pointer}
.mode:hover{border-color:var(--brand);transform:translateY(-2px)}
.mode .e{font-size:30px}
.mode b{display:block;margin-top:8px;font-size:15.5px}
.mode small{color:var(--ink-3);font-size:12.5px}
.detrow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.detrow .ava{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:var(--surface-2);flex:none}
.bars{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:12px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%;justify-content:flex-end}
.bars .c i{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--grad)}
.bars .c i.cw{background:#C7D2FE}
.bars small{font-size:10.5px;color:var(--ink-3)}
.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:16px}
.plan{border:1.5px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:10px;background:var(--surface);position:relative}
.plan.rec{border-color:var(--brand);box-shadow:0 12px 30px rgba(99,102,241,.22)}
.plan .pop{position:absolute;top:-11px;left:18px;background:var(--grad);color:#fff;font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px}
.plan .pr{font-size:30px;font-weight:900;letter-spacing:-.03em;line-height:1}
.plan ul{list-style:none;padding:0;margin:0;font-size:13px;color:var(--ink-2);display:grid;gap:6px}
.plan li::before{content:"✓";color:var(--good);font-weight:900;margin-right:7px}
.offer{border:1.5px solid var(--line);border-radius:18px;padding:16px;display:flex;gap:14px;align-items:center}
.offer.best{border-color:var(--brand);background:var(--brand-soft)}
.offer .amt{font-size:24px;font-weight:900;letter-spacing:-.02em;white-space:nowrap}
.lockwrap{position:relative}
.lockwrap .blur{filter:blur(6px);pointer-events:none;user-select:none;opacity:.7}
.lockwrap .over{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20px}
.lockwrap .over>div{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow);max-width:420px}
.planchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:99px;background:var(--grad);color:#fff;letter-spacing:.02em;vertical-align:1px}
input[type=range]{width:100%;accent-color:var(--brand)}
.mob-nav{display:none}
.mob-brand{display:none;align-items:center;gap:8px;font-weight:900;font-size:19px;margin-bottom:14px;letter-spacing:-.03em}
.mob-brand svg{width:30px;height:30px}
.disclaimer{font-size:12px;color:var(--ink-3);margin-top:30px;line-height:1.6}
@media (max-width:980px){.g3{grid-template-columns:1fr 1fr}}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding:18px 16px 120px}
  .g2,.g3,.modes,.plans{grid-template-columns:1fr}
  .grid>*{grid-column:auto !important}
  .top h1{font-size:25px}
  .top .actions{margin-left:0;width:100%}
  .mob-brand{display:flex}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero .row{flex-wrap:wrap}
  .big{font-size:34px}
  .mob-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom));z-index:40;justify-content:space-around;align-items:flex-end}
  .mob-nav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--ink-3);text-decoration:none;padding:4px 8px;font-weight:700;position:relative}
  .mob-nav a.active{color:var(--brand)}
  .mob-nav svg{width:23px;height:23px}
  .mob-nav .fab{width:60px;height:60px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 10px 24px rgba(99,102,241,.45);border:none}
  .mob-nav .fab svg{width:27px;height:27px}
}
@media print{.side,.mob-nav,.top .actions,.no-print,.disclaimer{display:none !important}.app{display:block}main{padding:0;max-width:none}.card{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<nav class="mob-nav" id="mobnav"></nav>
<div id="modal-root"></div>

<script>
/* =====================================================================
   Ownwise v3 — Scan your home. Own it wisely.
   A verified, living asset register for households, property investors
   and small businesses. All data stays on this device (localStorage).
   ===================================================================== */

// ---------- Helpers ----------
const EMBED = (()=>{ try { return window.self !== window.top; } catch(e){ return true; } })(); // hosted in the Claude viewer
let SAMPLE = null, SAMPLE_IMG = false, SAMPLE_MAX = 3, DL = null;
if (EMBED && window.claude && typeof window.claude.use === 'function'){
  window.claude.use('sample').then(sm => { SAMPLE = sm; return sm ? sm.limits().catch(()=>null) : null; })
    .then(l => { SAMPLE_IMG = !!(l && l.images); SAMPLE_MAX = Math.min(3, (l && l.images && l.images.maxCount) || 3); try { if (S && S.me) renderNav(); } catch(e){} }).catch(()=>{});
  window.claude.use('downloads').then(d => { DL = d; }).catch(()=>{});
}
const aiLive = () => EMBED ? (!!SAMPLE && SAMPLE_IMG) : !!(S.ai && S.ai.key);
function dataToBlob(d){ const [h, b] = d.split(','); const bin = atob(b); const u = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return new Blob([u], {type:(h.match(/data:([^;]+)/)||[])[1] || 'image/jpeg'}); }
const $ = (s, el=document) => el.querySelector(s);
const fmt = (n, d=0) => (n<0?'-':'') + '$' + Math.abs(Math.round((n||0)*10**d)/10**d).toLocaleString('en-AU',{minimumFractionDigits:d,maximumFractionDigits:d});
const uid = () => Math.random().toString(36).slice(2,10);

// ---------- Item intelligence ----------
const tierAdjust = p => p >= 2000 ? 1.25 : p >= 800 ? 1.1 : (p > 0 && p < 150) ? 0.75 : 1;
function intel(it){
  const c = CATS[it.cat] || CATS.other; const age = yearsSince(it.date); const price = num(it.price);
  const life = c.life * tierAdjust(price);
  const warrantyEnd = addYears(it.date, num(it.warranty));
  const rightsEnd = addYears(it.date, life);
  const base = appreciates(it.cat) ? (num(it.value)||price) : price;
  const resaleAt = t => base * Math.pow(1 - c.dep, t);
  const resale = resaleAt(age);
  const replacement = (num(it.value) || price) * Math.pow(1.03, age);
  const inWarranty = Date.now() < warrantyEnd;
  const rightsLeft = (rightsEnd - Date.now())/YEAR;
  let status, tone;
  if (appreciates(it.cat)){ status = it.irreplaceable ? 'Irreplaceable' : 'Valuable'; tone='coral'; }
  else if (it.secondHand && !price){ status='Came with property'; tone=''; }
  else if (inWarranty){ status = 'Under warranty'; tone='good'; }
  else if (rightsLeft > life*0.25){ status = 'Rights still strong'; tone='brand'; }
  else if (rightsLeft > 0){ status = 'Rights weakening'; tone='warn'; }
  else { status = 'Past expected life'; tone=''; }
  const estUses = it.uses != null ? it.uses : Math.round(age * 52 * (it.upw ?? c.upw));
  const costPerUse = estUses > 0 && price > 0 && !appreciates(it.cat) ? Math.max(0, price - resale) / estUses : null;
  const idleDays = it.lastUsed ? (Date.now() - new Date(it.lastUsed))/DAY : null;
  const lossNext12 = Math.max(0, resale - resaleAt(age+1));
  const recall = RECALLS.find(r => r.match.test(`${it.brand||''} ${it.name} ${it.model||''}`));
  return { c, age, life, warrantyEnd, rightsEnd, rightsLeft, resale, resaleAt, replacement, inWarranty, status, tone, estUses, costPerUse, idleDays, lossNext12, recall };
}

// ---------- Tax depreciation engine (Div 40 plant & equipment + Div 43 capital works) ----------
const fyOf = d => { const x = new Date(d); return x.getMonth() >= 6 ? x.getFullYear()+1 : x.getFullYear(); };
const CUR_FY = fyOf(new Date());
const fyLabel = Y => `${Y-1}–${String(Y).slice(2)}`;
function depFor(it, pl, Y){
  if (!pl || pl.type === 'home') return null;
  const cost = num(it.price); const y0 = fyOf(it.date);
  if (appreciates(it.cat)) return {excluded:true, reason:'Not a depreciating asset'};
  if (pl.type==='rental' && it.secondHand) return {excluded:true, reason:'Second-hand plant in an established residential rental acquired after 9 May 2017 — decline in value not deductible for individual investors (may matter for CGT on sale).'};
  if (!cost || Y < y0) return {method:'—', opening:0, ded:0, closing:cost, notYet:Y<y0};
  const el = (CATS[it.cat]||CATS.other).el || 5;
  const fyEnd = new Date(`${y0}-06-30`); const firstFrac = Math.min(1, Math.max(0, (fyEnd - new Date(it.date))/DAY + 1) / 365);
  let method, step;
  if (pl.type === 'business'){
    if (cost < 20000){ method = 'Instant asset write-off'; step = (open, y) => y===y0 ? open : 0; }
    else { method = 'Small business pool'; step = (open, y) => open * (y===y0 ? .15 : .30); }
  } else if (cost <= 300){ method = 'Immediate (≤$300)'; step = (open, y) => y===y0 ? open : 0; }
  else if (cost <= 1000){ method = 'Low-value pool'; step = (open, y) => open * (y===y0 ? .1875 : .375); }
  else if (pl.method === 'pc'){ method = `Prime cost · ${el} yrs`; step = (open, y) => Math.min(open, cost/el * (y===y0 ? firstFrac : 1)); }
  else { method = `Diminishing value · ${el} yrs`; step = (open, y) => open * Math.min(1, 2/el) * (y===y0 ? firstFrac : 1); }
  let open = cost, out = null;
  for (let y=y0; y<=Y; y++){ const d = Math.min(open, step(open, y)); if (y===Y) out = {method, el, opening:open, ded:d, closing:open-d}; open -= d; }
  return out;
}
function capWorks(pl, Y){
  if (pl.type !== 'rental' || !num(pl.buildCost) || !pl.built) return 0;
  const start = new Date(Math.max(new Date(pl.built), new Date(pl.purchased||pl.built)));
  const end = addYears(pl.built, 40);
  const fs = new Date(`${Y-1}-07-01`), fe = new Date(`${Y}-06-30`);
  const a = Math.max(start, fs), b = Math.min(end, fe);
  const days = b > a ? (b - a)/DAY + 1 : 0;
  return num(pl.buildCost) * 0.025 * Math.min(365, days) / 365;
}
function schedule(pl, Y=CUR_FY){
  const items = S.items.filter(i => i.place===pl.id && i.status!=='sold');
  const rows = items.map(i => ({i, d: depFor(i, pl, Y)})).filter(r => r.d);
  const plant = rows.filter(r=>!r.d.excluded).reduce((s,r)=>s+r.d.ded,0);
  const cw = capWorks(pl, Y);
  return { rows, plant, cw, total: plant + cw, excluded: rows.filter(r=>r.d.excluded) };
}
const taxPlaces = () => S.places.filter(p=>p.type!=='home');
const deductionsThisFY = () => taxPlaces().reduce((s,p)=>s+schedule(p).total,0);

// ---------- Portfolio, cover & score ----------
function quickEstimate(){
  const h = S.me?.home || {beds:3, people:2, tier:'average'}; const m = {basic:.7, average:1, premium:1.6}[h.tier] || 1;
  const beds = num(h.beds), ppl = Math.max(1, num(h.people));
  return Math.round((15000 + 12000 + 4000 + (beds>0 ? 14000 + (beds-1)*9000 : 6000) + ppl*9500 + 8000) * m / 1000) * 1000;
}
function portfolio(){
  const X = S.items.filter(i => i.status !== 'sold').map(i => ({...i, x: intel(i), p: placeOf(i)}));
  const homeX = X.filter(i => i.p.type === 'home');
  const replacement = homeX.reduce((s,i)=>s+i.x.replacement,0);
  const total = X.reduce((s,i)=>s+i.x.replacement,0);
  const needed = Math.max(replacement, quickEstimate()); const cover = num(S.me?.cover);
  const recalls = X.filter(i=>i.x.recall && !S.done['recall-'+i.id]);
  const idle = X.filter(i=>i.x.idleDays!=null && i.x.idleDays>180 && i.x.resale>80 && !appreciates(i.cat));
  const protectedVal = X.filter(i=>!i.x.inWarranty && i.x.rightsLeft>0 && num(i.price)>0 && !appreciates(i.cat)).reduce((s,i)=>s+num(i.price),0);
  const noPhoto = X.filter(i=>!i.photo && !i.verified && i.x.replacement>300);
  const verified = X.filter(i=>i.verified).length;
  return { X, homeX, replacement, total, needed, cover, gap: needed-cover, recalls, idle, protectedVal, noPhoto, verified };
}
function score(P = portfolio()){
  const parts = [
    {k:'Cover', max:25, v: P.needed ? Math.round(25*Math.min(1, P.cover/P.needed)) : 25, tip: P.gap>0 ? `Close your ${fmt(P.gap)} cover gap` : null, go:'#/reports'},
    {k:'Evidence', max:25, v: P.X.length ? Math.round(25*(1 - P.noPhoto.length/Math.max(1,P.X.filter(i=>i.x.replacement>300).length))) : 0, tip: P.noPhoto.length ? `Add photos to ${P.noPhoto.length} items` : null, go:'#/assets'},
    {k:'Safety', max:20, v: P.recalls.length ? 0 : 20, tip: P.recalls.length ? 'Deal with your recalled item' : null, go:'#/today'},
    {k:'Up to date', max:20, v: Math.max(0, 20 - S.inbox.length*5 - (Object.keys(S.scans).length ? 0 : 6)), tip: S.inbox.length ? `Confirm ${S.inbox.length} new purchase${S.inbox.length>1?'s':''}` : !Object.keys(S.scans).length ? 'Scan a room' : null, go:'#/today'},
    {k:'Records', max:10, v: P.X.length ? Math.round(10*P.X.filter(i=>i.retailer && i.date).length/P.X.length) : 0, tip:null},
  ];
  const total = parts.reduce((s,p)=>s+p.v,0);
  const next = parts.filter(p=>p.tip).sort((a,b)=>(b.max-b.v)-(a.max-a.v))[0];
  return { total, parts, next, gain: next ? next.max-next.v : 0 };
}

  });

  P.idle.slice(0,1).forEach(i => L.push({id:'idle-'+i.id+'-'+new Date().getMonth(), tone:'brand', e:'💸', tag:'Sell window', t:`Your ${i.name} hasn't been used in ${Math.round(i.x.idleDays/30)} months`, d:`It's worth about ${fmt(i.x.resale)} today and will lose ~${fmt(i.x.lossNext12)} over the next year.`, act:[[`Get ${fmt(offersFor(i).payout)} on Ownwise Market`,`sellModal('${i.id}')`,'primary'],[`Instant offer ${fmt(offersFor(i).instant)}`,`sellModal('${i.id}')`],['Keep it',`done('idle-${i.id}-${new Date().getMonth()}')`]]}));
  P.X.filter(i=>i.x.rightsLeft<=0&&num(i.price)>0&&!appreciates(i.cat)&&i.p.type==='home').slice(0,1).forEach(i => L.push({id:'replace-'+i.id+'-'+new Date().getMonth(), tone:'warn', e:'🔁', tag:'Plan ahead', t:`Your ${i.name} is past its expected life`, d:`It's ${yrs(i.x.age)} old — most last about ${yrs(i.x.life)}. Replace it on your terms (and trade the old one in) rather than when it dies.`, act:[['See options',`replaceModal('${i.id}')`,'primary'],['Not yet',`done('replace-${i.id}-${new Date().getMonth()}')`]]}));
  const unscanned = ['Living','Kitchen','Bedroom 1','Office'].filter(r=>!S.scans[r]);
  if (unscanned.length) L.push({id:'scan-'+unscanned.join(), tone:'brand', e:'📸', tag:'60-second task', t:`Scan your ${unscanned[0].toLowerCase()}`, d:`Point your camera around the room and Ownwise lists everything in it — with values. ${unscanned.length-1 ? `${unscanned.length-1} more rooms to go.` : 'Last room!'}`, act:[['Scan now',`openScanner('room')`,'grad']]});
  if (P.noPhoto.length) L.push({id:'photos-'+P.noPhoto.length, tone:'', e:'🖼️', tag:'Claim-ready', t:`${P.noPhoto.length} items have no photo evidence`, d:'Insurers ask for proof of ownership and condition. A verified photo takes 5 seconds and lifts your score.', act:[['Snap them',`openScanner('item')`,'primary']]});
  return L.filter(m => !S.done[m.id]);
}

function valueChart(it, x){
  const W=600,H=170,P=26; const span = Math.max(x.life*1.2, x.age+1, 3);
  const px = t => P + t/span*(W-2*P); const rep = t => (num(it.value)||num(it.price))*Math.pow(1.03,t);
  const maxV = Math.max(rep(span), x.resaleAt(0)) * 1.05 || 1; const py = v => H-P - v/maxV*(H-2*P);
  const pts = f => Array.from({length:41},(_,k)=>{ const t=k/40*span; return `${px(t).toFixed(1)},${py(f(t)).toFixed(1)}`; }).join(' ');
  const wy = Math.min(span, num(it.warranty)); const step = Math.max(1, Math.ceil(span/8));
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto">
    ${appreciates(it.cat)?'':`<rect x="${px(0)}" y="${P-6}" width="${px(Math.min(x.life,span))-px(0)}" height="${H-2*P+6}" fill="var(--brand)" opacity=".08" rx="6"/>`}
    ${wy>0?`<rect x="${px(0)}" y="${P-6}" width="${px(wy)-px(0)}" height="${H-2*P+6}" fill="var(--good)" opacity=".13" rx="6"/>`:''}
    <polyline points="${pts(rep)}" fill="none" stroke="var(--ink-3)" stroke-width="2" stroke-dasharray="5 5"/>
    <polyline points="${pts(x.resaleAt)}" fill="none" stroke="var(--brand)" stroke-width="3"/>
    <line x1="${px(x.age)}" x2="${px(x.age)}" y1="${P-8}" y2="${H-P}" stroke="var(--coral)" stroke-width="2"/><circle cx="${px(x.age)}" cy="${py(x.resale)}" r="5" fill="var(--coral)"/>
    <text x="${px(x.age)+6}" y="${P+4}" font-size="11" fill="var(--coral)" font-weight="700">Today</text>
    ${wy>0?`<text x="${px(0)+6}" y="${H-P-6}" font-size="11" fill="var(--good)" font-weight="700">Warranty</text>`:''}
    ${appreciates(it.cat)?'':`<text x="${Math.min(px(x.life), W-P)-6}" y="${P+20}" font-size="11" fill="var(--brand)" text-anchor="end" font-weight="700">Expected life</text>`}
    <line x1="${P}" x2="${W-P}" y1="${H-P}" y2="${H-P}" stroke="var(--line)"/>
    ${Array.from({length:Math.floor(span)+1},(_,k)=>k).filter(k=>k%step===0).map(k=>`<text x="${px(k)}" y="${H-P+16}" font-size="10.5" fill="var(--ink-3)" text-anchor="middle">${new Date(it.date).getFullYear()+k}</text>`).join('')}
  </svg><div class="row wrap muted" style="gap:14px;font-size:12px"><span><b style="color:var(--brand)">━</b> Resale value</span><span><b>┅</b> Cost to replace</span>${appreciates(it.cat)?'':'<span><b style="color:var(--brand);opacity:.5">■</b> Expected life (consumer rights)</span>'}</div>`;
}

  <div class="row wrap" style="margin-top:16px;gap:8px">${!ap&&num(it.price)?`<button class="btn coral" onclick="brokeModal('${id}')">${icon('zap')} It broke</button>`:''}<label class="btn">${icon('camera')} ${it.photo?'Retake':'Add'} photo<input type="file" accept="image/*" capture="environment" hidden onchange="photoFor('${id}',this.files[0])"></label>${!ap?`<button class="btn" onclick="sellModal('${id}')">${it.listed?'Listed '+fmt(it.listed.price):'Sell · '+fmt(offersFor(it).payout)}</button>`:''}${!ap&&num(it.price)&&x.rightsLeft<=1?`<button class="btn" onclick="replaceModal('${id}')">Replace</button>`:''}

  <button class="btn ghost danger" style="margin-left:auto" onclick="askConfirm('Remove this item?',()=>{S.items=S.items.filter(i=>i.id!=='${id}');save();closeModal();render()})">${icon('trash')}</button></div>`);
}
function photoFor(id, file){ compress(file, async d => { const it=S.items.find(i=>i.id===id); it.photo=d; it.verified={at:todayISO(), hash: await sha(d)}; save(); render(); itemSheet(id); toast('Verified photo saved ✓'); }); }
async function sha(s){ try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join(''); } catch(e){ return 'local'; } }
function compress(file, cb, max=900){ if(!file) return; const r=new FileReader(); r.onload=()=>{ const img=new Image(); img.onload=()=>{ const s=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=img.width*s; c.height=img.height*s; c.getContext('2d').drawImage(img,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.72)); }; img.src=r.result; }; r.readAsDataURL(file); }

const AI_SCHEMA = {type:'object', additionalProperties:false, required:['items'], properties:{items:{type:'array', items:{type:'object', additionalProperties:false,

  <form class="stack" style="margin-top:14px" onsubmit="event.preventDefault();assess('${id}',this)">
    <div><label class="f">1. What's the problem?</label>${ISSUES.map(([k,l],n)=>`<label class="opt"><input type="radio" name="issue" value="${k}" ${n===0?'checked':''}>${l}</label>`).join('')}</div>
    <div><label class="f">2. Would you have bought it if you'd known?</label><label class="opt"><input type="radio" name="known" value="no" checked>No way</label><label class="opt"><input type="radio" name="known" value="yes">Probably — it's minor</label></div>
    <div><label class="f">3. Can it be fixed easily and quickly?</label><label class="opt"><input type="radio" name="fix" value="no">No — or it's been repaired before</label><label class="opt"><input type="radio" name="fix" value="unsure" checked>Not sure / probably</label></div>
    <div class="row"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" style="margin-left:auto">See my rights</button></div></form>`);
}
function assess(id, f){
  const it=S.items.find(i=>i.id===id); const x=intel(it); const issue=f.issue.value;
  const major = issue==='unsafe' || issue==='notdesc' || f.known.value==='no' || f.fix.value==='no';
  const label = ISSUES.find(i=>i[0]===issue)[1];
  const letter = `${dstr(Date.now())}\n\nTo: ${it.retailer||'[Seller]'}\nRe: Consumer guarantee claim — ${[it.brand,it.name,it.model?`(${it.model})`:''].filter(Boolean).join(' ')}\n\nI purchased this item from you on ${dstr(it.date)} for ${fmt(num(it.price),2)}. Proof of purchase is attached${it.verified?', along with a time-stamped photo record of its condition':''}.\n\nThe problem: ${label.toLowerCase()}.\n\nUnder the Australian Consumer Law, goods must be of acceptable quality, including durable and free from defects, as a reasonable consumer would expect given their price and nature (s 54). This item is ${yrs(x.age)} old; a reasonable consumer would expect it to last considerably longer.\n\n${major?'As this is a major failure, I request a full refund or, at my election, a replacement.':'I request that you remedy this failure free of charge within a reasonable time.'} These rights apply regardless of any manufacturer's warranty (ss 259–263).\n\nPlease respond within 14 days. If we can't resolve this, I will contact ${STATES[S.me.state||'NSW']}.\n\nKind regards,\n${S.me.name||'[Your name]'}`;
  modal(`<h2>${major?'Major failure — you choose the remedy':'Minor failure — the seller must fix it'}</h2>
  <div class="callout ${major?'coral':''}" style="margin-top:8px">${major?'You can choose a <b>refund or replacement</b>. You don\'t have to accept a repair.':'The seller must repair, replace or refund <b>free, within a reasonable time</b>. If they don\'t, it can become a major failure.'}</div>
  ${!x.inWarranty&&x.rightsLeft>0?`<div class="callout good" style="margin-top:10px">✅ Out of warranty, but within the ~${yrs(x.life)} it should reasonably last. Don't accept "it's out of warranty".</div>`:''}
  ${x.rightsLeft<=0?`<div class="callout warn" style="margin-top:10px">It's past the ~${yrs(x.life)} it should reasonably last, so the seller may push back. Your fastest options:</div><div class="row wrap" style="gap:8px;margin-top:10px"><button class="btn primary" onclick="bookRepair('${id}')">🔧 Book a partner repairer</button><button class="btn" onclick="replaceModal('${id}')">🔁 See replacement deals</button></div>`:`<div class="muted" style="font-size:13px;margin-top:10px">Need it fixed today instead? <a href="javascript:bookRepair('${id}')">Book a partner repairer</a></div>`}
  <div class="letter" id="letter" style="margin-top:14px">${esc(letter)}</div>
  <div class="row wrap" style="margin-top:14px"><button class="btn" onclick="copyText('#letter')">${icon('copy')} Copy</button><button class="btn primary" style="margin-left:auto" onclick="S.claims.unshift({id:uid(),item:'${id}',date:todayISO(),major:${major}});S.done['claim-follow-${id}']=false;save();closeModal();toast('Sent ✓ — we\\'ll check in with you in 14 days')">I've sent it</button></div>
  <p class="muted" style="font-size:12px;margin-top:10px">General information, not legal advice.</p>`);
}
function recallLetter(id){ const it=S.items.find(i=>i.id===id); const r=intel(it).recall; modal(`<h2>Recall refund request</h2><div class="letter" id="letter" style="margin-top:12px">${esc(`${dstr(Date.now())}\n\nTo: ${it.retailer}\nRe: Product safety recall — ${r.title}\n\nI purchased a ${it.brand} ${it.model} from you on ${dstr(it.date)} for ${fmt(num(it.price),2)}. It is the subject of a safety recall issued ${dstr(r.date)}: ${r.hazard}\n\nI have stopped using it. As set out in the recall, please arrange a full refund. Proof of purchase is attached.\n\nKind regards,\n${S.me.name||'[Your name]'}`)}</div><div class="row" style="margin-top:14px"><button class="btn" onclick="copyText('#letter')">${icon('copy')} Copy</button><button class="btn primary" style="margin-left:auto" onclick="closeModal()">Done</button></div>`); }
function listingModal(id){
  const it=S.items.find(i=>i.id===id); const x=intel(it); const ask=Math.max(5, Math.round(x.resale/5)*5);
  const text = `${[it.brand, it.name].filter(Boolean).join(' ')}${it.model?` — ${it.model}`:''}\n\n$${ask.toLocaleString()} (about $${Math.round(x.replacement).toLocaleString()} new)\n\nBought ${new Date(it.date).toLocaleDateString('en-AU',{month:'long',year:'numeric'})}${it.retailer?` from ${it.retailer}`:''}. Well looked after and in great working order. Original receipt${it.verified?' and verified ownership record':''} available.\n\nPick up, or happy to arrange delivery.`;
  modal(`<h2>Sell your ${esc(it.name)}</h2><p class="muted">Suggested price: <b>${fmt(ask)}</b> · waiting a year costs ~${fmt(x.lossNext12)}</p><div class="letter" id="letter" style="margin-top:12px">${esc(text)}</div><div class="row wrap" style="margin-top:14px"><button class="btn" onclick="copyText('#letter')">${icon('copy')} Copy listing</button><button class="btn" onclick="const i=S.items.find(i=>i.id==='${id}');i.status='sold';S.found.push({label:'Sold '+i.name,amount:${ask},date:todayISO()});save();closeModal();render();toast('Sold 🎉')">Mark as sold</button><button class="btn primary" style="margin-left:auto" onclick="closeModal()">Done</button></div>`);
}
function claimPack(){
  if (!has('claimpack')) return paywall('claimpack');
  const P = portfolio(); const rows = P.homeX.slice().sort((a,b)=>(a.room||'').localeCompare(b.room||''));
  const html = `<!doctype html><html><head><meta charset="utf-8"><title>Ownwise claim pack</title><style>body{font-family:system-ui,sans-serif;margin:32px;color:#111}table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:16px}th,td{border-bottom:1px solid #ddd;padding:7px;text-align:left}.n{text-align:right}img{width:48px;height:48px;object-fit:cover;border-radius:6px}.room td{background:#f2f2f8;font-weight:700}</style></head><body>
  <h1 style="margin:0">Contents inventory & claim pack</h1><p>${esc(S.me.name||'')} · Generated by Ownwise ${dstr(Date.now())} · ${rows.length} items · Replacement value <b>${fmt(P.replacement)}</b> · Sum insured ${fmt(P.cover)}</p>
  <table><thead><tr><th></th><th>Item</th><th>Brand / model</th><th>Acquired</th><th>From</th><th>Evidence</th><th class="n">Paid</th><th class="n">Replacement</th></tr></thead><tbody>
  ${[...new Set(rows.map(r=>r.room))].map(room=>`<tr class="room"><td colspan="8">${esc(room)}</td></tr>`+rows.filter(r=>r.room===room).map(i=>`<tr><td>${i.photo?`<img src="${i.photo}" style="width:44px;height:44px;object-fit:cover;border-radius:6px">`:(CATS[i.cat]||CATS.other).e}</td><td>${esc(i.name)}</td><td>${esc(i.brand)} ${esc(i.model)}</td><td>${dstr(i.date)}</td><td>${esc(i.retailer)}</td><td>${i.verified?'Verified photo '+dstr(i.verified.at):'—'}</td><td class="n">${i.price?fmt(num(i.price),2):'—'}</td><td class="n">${fmt(i.x.replacement,2)}</td></tr>`).join('')).join('')}
  </tbody></table></body></html>`;
  if (EMBED){ window._cp = html; return modal(`<div class="row between"><h2>Claim pack</h2><button class="btn ghost" onclick="closeModal()">${icon('x')}</button></div><button class="btn primary" style="margin:8px 0 12px" onclick="download('ownwise-claim-pack.html', window._cp, 'text/html')">${icon('download')} Save claim pack (open & print from your phone)</button><div class="tablewrap">${html.split('<body>')[1].split('</body>')[0].replace('<h1 style="margin:0">Contents inventory & claim pack</h1>','')}</div>`); }
  const w = window.open('', '_blank'); if (w){ w.document.write(html); w.document.close(); setTimeout(()=>{ try{ w.print(); }catch(e){} }, 400); } else download('ownwise-claim-pack.html', html, 'text/html');
}

// ---------- Onboarding ----------
function onboarding(){
  modal(`<div class="hero-pic" style="height:150px;background:var(--grad);font-size:0;margin-bottom:18px"><div style="width:76px;height:76px">${logo()}</div></div>
  <h2 style="font-size:27px">Scan your home in 60 seconds.</h2>
  <p class="muted" style="font-size:15px">Ownwise builds a verified, living register of everything you own — then keeps working for you:</p>
  <div class="stack" style="margin:14px 0">
    <div class="row"><span style="font-size:22px">☂️</span><div><b>Know your real insurance number</b> <span class="muted">and claim in one tap</span></div></div>
    <div class="row"><span style="font-size:22px">🧾</span><div><b>Accountant-ready depreciation</b> <span class="muted">for rentals & business assets</span></div></div>
    <div class="row"><span style="font-size:22px">⚖️</span><div><b>Your rights after warranty</b> <span class="muted">— and recall alerts</span></div></div>
  </div>
  <div class="fgrid"><div><label class="f">First name</label><input class="input" id="ob-name" placeholder="e.g. Kobi"></div><div><label class="f">State</label><select class="input" id="ob-state">${Object.keys(STATES).map(s=>`<option ${s==='VIC'?'selected':''}>${s}</option>`).join('')}</select></div></div>
  <div class="stack" style="margin:14px 0"><label class="f" style="margin:0">What do you want to track?</label><div class="fgrid">${Object.entries(PLACE_TYPES).map(([k,v])=>`<label class="opt"><input type="checkbox" value="${k}" ${k!=='business'?'checked':''} class="ob-pt">${v.e} <b>${v.n}</b></label>`).join('')}</div></div>
  <label class="row" style="margin-bottom:16px"><input type="checkbox" id="ob-demo" checked> Explore with a demo household first</label>
  <button class="btn grad" style="width:100%;padding:14px;font-size:15px" onclick="finishOnboarding()">Get started</button>`);
}
function finishOnboarding(){
  const d = $('#ob-demo').checked; S.me = {name:$('#ob-name').value.trim(), state:$('#ob-state').value, cover:d?60000:0, home:{beds:3, people:2, tier:'average'}};
  if (d){ Object.assign(S, demo(), {plan:{tier:'free'}, usage:{}, rev:[]}); S.place='home'; }
  else { const types=[...document.querySelectorAll('.ob-pt:checked')].map(x=>x.value); S.places = (types.length?types:['home']).map(t=>({id:uid(), type:t, name:PLACE_TYPES[t].n, sub:'', method:'dv'})); S.place=S.places[0].id; }
  save(); closeModal(); nav('#/today'); render();
}

render();
</script>
